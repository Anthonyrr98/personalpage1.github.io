# 首次运行 npm run life:init 会复制本文件为 drafts/life.toml。
# 编辑 drafts/life.toml 后运行 npm run life:new。
title = "" # 必填，例如「周末去公园」
date = "YYYY-MM-DD" # 必填，例如「2026-09-26」
description = "" # 可留空，生成时使用标题。
slug = "" # 可留空，生成器会创建唯一地址；发布后不要改地址。
body = '''
在这里写 Markdown 正文。
'''

